<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Access · GIMMETHELOOP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #090909;
        color: #f4f2ef;
        font-family: "Zalando Sans Expanded", sans-serif;
      }
      .card {
        width: min(680px, 100%);
        padding: 28px;
        border-radius: 24px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
      }
      .eyebrow {
        color: #ff5a1f;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0 0 12px;
        text-transform: uppercase;
        font-size: clamp(1.8rem, 5vw, 3rem);
      }
      p {
        margin: 0;
        color: rgba(244,242,239,0.72);
        line-height: 1.6;
        max-width: 34rem;
      }
      a {
        display: inline-flex;
        margin-top: 20px;
        color: #f4f2ef;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Hold</div>
      <h1>Community access is not live yet.</h1>
      <p>The Discord lane and monthly pass are being held back until the community setup is ready. Keep testing the app and we will open this again when the real flow is wired.</p>
      <a href="/">Back to loop</a>
    </main>
  </body>
</html>
