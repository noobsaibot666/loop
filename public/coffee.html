<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" />
    <title>Coffee · GIMME THE LOOP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
    <style>
      :root {
        --bg: #0A0A0A;
        --panel: rgba(255, 255, 255, 0.03);
        --border: hsla(0, 0%, 100%, 0.08);
        --text: #ffffff;
        --muted: #888888;
        --accent: #645AD0;
        --font-header: "Syncopate", sans-serif;
        --font-mono: "Space Mono", monospace;
        --radius: 4px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-mono);
        background: var(--bg);
        color: var(--text);
        padding: 40px 24px;
        line-height: 1.6;
        letter-spacing: -0.02em;
        min-height: 100vh;
      }
      .wrap { max-width: 800px; margin: 0 auto; }
      .back {
        display: inline-block;
        margin-bottom: 32px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 700;
        transition: color 0.2s ease;
      }
      .back:hover { color: var(--accent); }
      .card {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: var(--radius);
        padding: 48px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .eyebrow {
        color: var(--accent);
        font-size: 0.75rem;
        margin: 0 0 16px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }
      h1 {
        font-family: var(--font-header);
        font-size: clamp(2rem, 8vw, 3.2rem);
        margin: 0 0 24px;
        text-transform: uppercase;
        line-height: 1.02;
        letter-spacing: 0.05em;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        max-width: 36rem;
        color: var(--text);
        opacity: 0.7;
        font-size: 1.1rem;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 32px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 28px;
        border-radius: var(--radius);
        text-decoration: none;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-family: var(--font-header);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .button:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 8px 20px rgba(100, 90, 208, 0.3); }
      .button.ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .button.ghost:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="/">← Back home</a>
      <div class="card">
        <p class="eyebrow">Keep it rolling</p>
        <h1>Buy the crew a coffee</h1>
        <p>Hosting, maps, storage, and city packs cost real money. If the app hits for you, kick something back.</p>
        <p>It helps keep Alleycat packs live, wall posts up, and the next city on deck.</p>
        <div class="actions">
          <a class="button" href="https://buymeacoffee.com/js4mhwqrdjd">Open support link</a>
          <a class="button ghost" href="/">Back to the app</a>
        </div>
      </div>
    </div>
  </body>
</html>
