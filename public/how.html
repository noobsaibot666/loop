<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" />
    <title>How It Works · GIMME THE LOOP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
    <style>
      :root {
        --bg: #0A0A0A;
        --panel: rgba(255, 255, 255, 0.03);
        --border: hsla(0, 0%, 100%, 0.08);
        --text: #ffffff;
        --muted: #888888;
        --accent: #645AD0;
        --font-header: "Syncopate", sans-serif;
        --font-mono: "Space Mono", monospace;
        --radius: 4px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-mono);
        background: var(--bg);
        color: var(--text);
        padding: 40px 24px;
        line-height: 1.6;
        letter-spacing: -0.02em;
        min-height: 100vh;
      }
      .wrap { max-width: 800px; margin: 0 auto; }
      .back {
        display: inline-block;
        margin-bottom: 32px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        transition: color 0.2s ease;
      }
      .back:hover { color: var(--accent); }
      .card {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: var(--radius);
        padding: 48px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .eyebrow {
        color: var(--accent);
        font-size: 0.75rem;
        margin: 0 0 16px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }
      h1 {
        font-family: var(--font-header);
        font-size: clamp(1.8rem, 6vw, 2.8rem);
        margin: 0 0 32px;
        text-transform: uppercase;
        line-height: 1.05;
        letter-spacing: 0.05em;
        font-weight: 700;
      }
      ul { padding-left: 20px; margin: 0; list-style-type: square; }
      li { margin-bottom: 16px; color: var(--text); opacity: 0.8; font-size: 1rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="/">← Back home</a>
      <div class="card">
        <p class="eyebrow">How</p>
        <h1>Use the tool right</h1>
        <ul>
          <li>Use Loop when you want a fast way out and back.</li>
          <li>Use Alleycat when you want a sheet, checkpoints, proof, and a clock.</li>
          <li>Pick a city, lock the area, build the run, and go clear the list.</li>
          <li>Post proof if you want the hit on the wall.</li>
        </ul>
      </div>
    </div>
  </body>
</html>
