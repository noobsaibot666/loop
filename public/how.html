<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" />
    <title>How It Works · GIVE ME THE LOOP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" />
    <style>
      :root { --bg:#0b0b0b; --panel:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.1); --text:#f2f2f2; --muted:#9b9b9b; --accent:#ff5e14; }
      * { box-sizing: border-box; }
      body { margin:0; font-family:"Zalando Sans Expanded",sans-serif; background:var(--bg); color:var(--text); padding:24px; }
      .wrap { max-width:760px; margin:0 auto; }
      .back { display:inline-block; margin-bottom:24px; color:var(--muted); text-decoration:none; }
      .card { border:1px solid var(--border); background:var(--panel); border-radius:24px; padding:28px; }
      .eyebrow { color:var(--accent); font-size:.82rem; margin:0 0 16px; }
      h1 { font-size:clamp(2rem,8vw,3rem); margin:0 0 16px; text-transform:uppercase; line-height:1.02; }
      ul { max-width:720px; line-height:1.6; color:var(--muted); padding-left:18px; margin:0; }
      li + li { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="/">← Back home</a>
      <div class="card">
        <p class="eyebrow">How</p>
        <h1>Use the tool right</h1>
        <ul>
          <li>Use Loop when you want a fast way out and back.</li>
          <li>Use Alleycat when you want a sheet, checkpoints, proof, and a clock.</li>
          <li>Pick a city, lock the area, build the run, and go clear the list.</li>
          <li>Post proof if you want the hit on the wall.</li>
        </ul>
      </div>
    </div>
  </body>
</html>
